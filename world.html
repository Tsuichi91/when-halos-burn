<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#04080b" />
    <meta name="description" content="WHEN HALOS BURN — World. Explore Vesper City, HALO, Eclipse and the places that shape the story." />
    <link rel="preload" as="image" href="./images/landing/vesper-city.png" fetchpriority="high" />
    <link rel="preload" as="image" href="./images/world/halo-headquarters.png" />
    <link rel="preload" as="image" href="./images/world/eclipse-headquarters.png" />

  <body class="page page--world-mode">

      <div class="world-loader__scan" aria-hidden="true"></div>
      <div class="world-loader__vignette" aria-hidden="true"></div>

        <h1>WORLD</h1>
        <p class="world-loader__status" data-world-loader-status>CONNECTING CITY NETWORK</p>

        <div class="world-loader__meta" aria-hidden="true"><span>CITY GRID / VSP-2164</span><span>NETWORK / ACTIVE</span></div>
      </div>
    </section>

    <main id="world-app" class="world-mode"></main>
    <script type="module" src="/src/progressive-images.js"></script>

    <script type="module" src="/src/extras-nav.js"></script>
